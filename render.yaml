# Render "Blueprint" spec. Lets you deploy this whole app by connecting
# your repo and letting Render read this file, instead of clicking through
# every field by hand. See README.md "Deploying to Render" for the manual
# steps if you'd rather not use a Blueprint.
services:
  - type: web
    name: axiomdynamics-demo
    runtime: python
    plan: free
    # NOT --require-hashes, deliberately. This file deploys the public demo from
    # the public repo over the public internet; it is not a release path and
    # nothing it serves is a release artefact. Hash pinning applies to what the
    # Railroad receives — the Dockerfile image and the signed archive built by
    # tools/sign_release.py — because those are the things a substituted
    # dependency could reach a customer through. D09 §7.3.
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m backend.main"
    envVars:
      - key: AXIOM_HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.11.9
